<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Nibbo — arcade del jardín</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>NIBBO</h1>
  <p class="sub">El bichito-farol del jardín de setos</p>

  <div id="hud">
    <span>Puntos <b id="hud-score">0</b></span>
    <span>Récord <b id="hud-best">0</b></span>
    <span>Nivel <b id="hud-level">1</b></span>
    <span>Mejor tiempo <b id="hud-record">—</b></span>
    <span>Semillas <b id="hud-seeds">0</b></span>
    <span>Vidas <b id="hud-lives">●●●</b></span>
  </div>

  <div id="stage">
    <canvas id="cv" width="504" height="552"></canvas>
    <div id="overlay">
      <h2 id="overlay-title">NIBBO</h2>
      <p id="overlay-text"></p>
      <button id="btn-start" type="button">Jugar</button>
    </div>
    <div id="record-toast" class="hidden" role="status" aria-live="polite"></div>
  </div>

  <button id="btn-pause" type="button">Pausa (P)</button>
  <button id="btn-mute" type="button">Silenciar (M)</button>
  <p class="help">Flechas o WASD para moverte · P pausa · M sonido · swipe o toque en móvil.<br>
  Las 4 semillas grandes asustan a las polillas: ¡cázalas!</p>

  <script src="logic.js"></script>
  <script src="game.js"></script>
</body>
</html>
